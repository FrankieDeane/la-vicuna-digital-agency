[build]
  publish   = "."
  functions = "netlify/functions"

# Funciones (login admin y monitor de Mercado Libre del demo /automatizaciones)
[functions]
  node_bundler = "esbuild"

# Monitor The North Face en Mercado Libre: cada 15 minutos de 9:00 a 11:45 (hora AR = UTC-3).
# Cada corrida sigue el relevamiento del día donde quedó; si ya está listo, no hace nada.
[functions."tnf-ml-diario"]
  schedule = "*/15 12-14 * * *"

# El código de las funciones y las herramientas internas no se sirven como archivos
[[redirects]]
  from   = "/netlify/*"
  to     = "/404.html"
  status = 404
  force  = true
[[redirects]]
  from   = "/tools/*"
  to     = "/404.html"
  status = 404
  force  = true
[[redirects]]
  from   = "/package*"
  to     = "/404.html"
  status = 404
  force  = true
[[redirects]]
  from   = "/node_modules/*"
  to     = "/404.html"
  status = 404
  force  = true

# ---------------------------------------------------------------------------
# Cabeceras de seguridad globales (se aplican a todo el sitio)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Fuerza HTTPS en el navegador durante 2 años (evita ataques de downgrade
    # y man-in-the-middle). "preload" lo habilita antes de la primera visita.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Impide que el sitio sea embebido en un <iframe> de otro dominio
    # (proteccion contra clickjacking).
    X-Frame-Options = "DENY"

    # Evita que el navegador "adivine" el tipo de archivo (proteccion MIME-sniffing).
    X-Content-Type-Options = "nosniff"

    # No filtra la URL completa a sitios externos.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Desactiva APIs sensibles del navegador que el sitio no usa.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"

    # Aisla el sitio de otras ventanas/pestanas (proteccion contra ataques
    # cross-origin como Spectre / tabnabbing).
    Cross-Origin-Opener-Policy = "same-origin"

    # Content Security Policy: define exactamente que recursos puede cargar el
    # sitio. Bloquea la inyeccion de scripts maliciosos (XSS).
    #   script-src 'self' + googletagmanager -> scripts propios + gtag.js
    #     (GA4 lo inyecta js/main.js dinámicamente, solo si hay consentimiento
    #     de cookies aceptado — no hace falta permitir scripts inline).
    #   connect-src ... google-analytics    -> beacons de medición de GA4
    #   style-src ... fonts...       -> estilos propios + Google Fonts
    #   font-src ... gstatic         -> fuentes de Google
    #   img-src 'self' data: https:  -> imagenes propias, data-URI y https
    #   frame-src https:             -> previews de portfolio (sitios externos)
    #   frame-ancestors 'none'       -> nadie puede embeber este sitio
    #   object-src 'none'            -> sin Flash/plugins
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; frame-src https:; upgrade-insecure-requests"

# ---------------------------------------------------------------------------
# Cache agresivo para assets estaticos (imagenes, etc.)
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

